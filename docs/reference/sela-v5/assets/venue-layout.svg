<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc">
<title id="title">Contoh layout Ruang Pertunjukan Tengah</title><desc id="desc">Panggung di atas, dua blok kursi A sampai F dengan lorong tengah. Pintu masuk di bawah kiri dan pintu keluar di bawah kanan. Diagram contoh, bukan pemilihan kursi.</desc>
