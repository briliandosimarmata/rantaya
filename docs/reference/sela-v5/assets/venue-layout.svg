<text x="500" y="81" font-size="17">Layout contoh · Di Balik Layar</text>
<rect x="220" y="115" width="560" height="115" rx="15" fill="#172322"/>
<text x="500" y="179" fill="#F4F5F7" font-size="26" font-weight="bold">PANGGUNG</text>
<text x="500" y="262" font-size="16">Depan panggung</text>
<g fill="#D3E96B" stroke="#172322" stroke-width="2">
