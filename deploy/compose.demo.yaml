name: rantaya-demo
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruang
      POSTGRES_USER: ruang
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruang -d ruang"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: demo
      APP_URL: ${APP_URL:?APP_URL is required}
      APP_ALLOWED_ORIGINS: ""
      API_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://ruang:${DB_PASSWORD}@db:5432/ruang?sslmode=disable
      UPLOAD_DIR: /data/uploads
      DEMO_LOGIN: "true"
      SEED_DEMO: "true"
      COOKIE_SECURE: "true"
      HOLD_MINUTES: "30"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: *logging
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP_URL: ${APP_URL:?APP_URL is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: *logging
volumes:
  db_data:
  uploads:
