server {
    listen 80;
    listen [::]:80;
    server_name rantaya.briliando.dev;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rantaya-acme;
    }
    location / {
        return 301 https://rantaya.briliando.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rantaya.briliando.dev;
    ssl_certificate /etc/letsencrypt/live/rantaya.briliando.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rantaya.briliando.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Private order/upload paths and tokens must not enter access logs.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
