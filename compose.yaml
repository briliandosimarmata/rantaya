services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ruang
      POSTGRES_USER: ruang
      POSTGRES_PASSWORD: ruang_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ruang_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruang -d ruang"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  ruang_db:
